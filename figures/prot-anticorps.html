<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anticorps IgG1 humain — 3D</title>
<!-- Généré par tools/gen_prot3d.py : ne pas éditer à la main. -->
<style>
  :root{
    --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --brand:#2563eb; --brand2:#0ea5e9;
    --accent:#f43f5e; --tail:#d97706; --water:#eaf6fd; --soft:#f8fafc;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--water);color:var(--ink);
    font-family:-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
  #view{position:fixed;inset:0;background:var(--water)}
  .card{position:absolute;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 2px 10px rgba(15,23,42,.08);z-index:3}
  .bar{top:14px;right:14px;padding:12px;display:grid;gap:10px;justify-items:start;max-width:340px}
  .bar .row{display:flex;gap:10px;flex-wrap:wrap}
  button{font:inherit;font-size:15px;font-weight:600;border-radius:9px;cursor:pointer;
    padding:7px 14px;border:2px solid var(--brand);background:#fff;color:var(--brand)}
  button.primary{background:var(--brand);color:#fff;min-width:118px}
  button[aria-pressed="true"]{background:var(--brand);color:#fff}
  button:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
  .seg{display:inline-flex;border:2px solid var(--brand);border-radius:9px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:7px 12px}
  .seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
  .note{font-size:13px;color:var(--muted)}
  .count{font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .legend{bottom:14px;right:14px;padding:9px 14px;display:grid;gap:4px;font-size:14px;color:var(--muted);max-width:300px}
  .legend .it{display:flex;align-items:baseline;gap:6px}
  .legend .it > span:first-child{flex:none}
  .legend .sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px}
  .legend .dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px}
  .legend .ln{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:3px}
  .legend .mb{display:inline-block;width:18px;height:6px;border-top:2px solid var(--muted);border-bottom:2px solid var(--muted);
    background:rgba(100,116,139,.2);vertical-align:1px}
  .legend .hd{color:var(--ink);font-weight:700}
  .legend .hd:not(:first-child){margin-top:4px}
  .legend[hidden],.check[hidden],#zones[hidden],#msg[hidden]{display:none}
  .check{left:14px;top:170px;max-width:700px;padding:9px 14px;font-size:13px;line-height:1.35;color:var(--ink);
    display:grid;gap:3px;z-index:5}
  #zones div{position:absolute;border:2px dashed #f43f5e;background:rgba(244,63,94,.06);pointer-events:none;z-index:4}
  #msg{left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;font-size:15px;z-index:6}
  /* mode agrandi : les encarts de la slide n'existent plus, la molécule est recentrée */
  :fullscreen .bar{padding:8px}
</style>
</head>

<div id="view" role="img" aria-label="Anticorps IgG1 humain en 3D (PDB 1HZH)"></div>
<div class="card bar">
  
  <div class="row">
    <button id="reset">↺ Vue initiale</button>
    <button id="spin" aria-pressed="true">⟳ Rotation auto</button>
    <button id="fs">⛶ Agrandir</button>
  </div>
</div>
<div class="card legend" id="leg">
  <span class="it"><span><span class="sw" style="background:#2563eb"></span></span><span>chaînes lourdes (H, K)</span></span>
  <span class="it"><span><span class="sw" style="background:#0ea5e9"></span></span><span>chaînes légères (L, M)</span></span>
  <span class="it"><span><span class="ln" style="background:#d97706"></span></span><span>glycanes (sucres)</span></span>
</div>
<div id="zones" hidden><div style="left:14px;top:14px;width:662px;height:146px"></div><div style="left:14px;top:600px;width:760px;height:106px"></div></div>
<div class="card check" id="check" hidden></div>

      serial++;
      // nom d'atome : colonne 13 pour un élément à deux lettres (FE), 14 sinon (CA = carbone α)
      const nm = names[j].length >= 4 || elems[j].length === 2 ? padR(names[j], 4) : ' ' + padR(names[j], 3);
      L.push((het ? 'HETATM' : 'ATOM  ') + padL(serial, 5) + ' ' + nm + ' ' + padL(resn, 3) + ' ' + ch
        + padL(resi, 4) + ic + '   ' + padL((c[3*k]/100).toFixed(3), 8) + padL((c[3*k+1]/100).toFixed(3), 8)
        + padL((c[3*k+2]/100).toFixed(3), 8) + '  1.00  0.00          ' + padL(elems[j], 2));
    }
  }
  for(const [a, b] of m.conect){
    L.push('CONECT' + padL(a + 1, 5) + padL(b + 1, 5));
    L.push('CONECT' + padL(b + 1, 5) + padL(a + 1, 5));
  }
  return L.join('\n');
}

// ---- cadrage : la zone libre de la slide (centre-droit), ou tout l'écran en mode agrandi ----
function layout(){
  const W = view.clientWidth, H = view.clientHeight;
  if(document.fullscreenElement || flag('fs', false)) return { W, H, full: true, cx: PAGE.full[0]*W, cy: PAGE.full[1]*H };
  return { W, H, full: false, cx: PAGE.slide[0]*W/1280, cy: PAGE.slide[1]*H/720 };   // iframe 1280 × 720
}
// Rectangles à ne pas recouvrir (px) : les deux encarts de la slide (hors mode agrandi) et les
// cartes de la page (toutes les légendes, même celle du mode de coloriage non affiché).
function forbidden(full){
  const R = full ? [] : [[14, 14, 676, 160], [14, 600, 774, 706]];
  document.querySelectorAll('.bar, .legend').forEach(el => {
    const hid = el.hidden;
    if(hid){ el.style.visibility = 'hidden'; el.hidden = false; }
    const r = el.getBoundingClientRect();
    if(hid){ el.hidden = true; el.style.visibility = ''; }
    R.push([r.left, r.top, r.right, r.bottom]);
  });
  return R;
}
// Cadrage : la plus grande échelle (px par Å) telle que l'enveloppe de la molécule pendant la
// rotation auto (PAGE.env : pour chaque tranche de hauteur, le rayon maximal autour de l'axe
// vertical) ne recouvre aucun rectangle interdit ; le centre de rotation est cherché autour du
// point préféré (PAGE.slide ou PAGE.full). La perspective (l'avant grossi d'un facteur d/(d - r))
// et l'inclinaison de la vue initiale sont comptées.
function fit(L){
  const tn = Math.tan(FOV*Math.PI/360), ct = Math.cos(PAGE.tilt), st = Math.sin(PAGE.tilt), M = 8;
  const rects = forbidden(L.full).map(r => [r[0] - M, r[1] - M, r[2] + M, r[3] + M]);
  const labels = (PAGE.sideY || []).map((y, i) => [y, (PAGE.sides[i].length*7.5 + 10)/2, 11]);
  const ok = (s, cx, cy) => {
    const d = (L.H/2)/(s*tn);
    for(const [y0, y1, r] of PAGE.env){
      const pf = d/(d - r), hx = r*s*pf, a = (y1*ct + r*st)*s, b = (y0*ct - r*st)*s;
      const top = cy - Math.max(a, a*pf), bot = cy - Math.min(b, b*pf);
      if(cx - hx < M || cx + hx > L.W - M || top < M || bot > L.H - M) return false;
      for(const R of rects) if(cx + hx > R[0] && cx - hx < R[2] && bot > R[1] && top < R[3]) return false;
    }
    for(const [y, hw, hh] of labels){
      const ly = cy - y*ct*s;
      if(ly - hh < M || ly + hh > L.H - M) return false;
      for(const R of rects) if(cx + hw > R[0] && cx - hw < R[2] && ly + hh > R[1] && ly - hh < R[3]) return false;
    }
    return true;
  };
  let best = null;
  for(let cy = L.cy - 80; cy <= L.cy + 80; cy += 8) for(let cx = L.cx - 240; cx <= L.cx + 240; cx += 8){
    let lo = 0.05, hi = PAGE.smax;
    if(!ok(lo, cx, cy)) continue;
    if(ok(hi, cx, cy)) lo = hi;
    else for(let i = 0; i < 16; i++){ const m = (lo + hi)/2; if(ok(m, cx, cy)) lo = m; else hi = m; }
    const score = lo*(1 - 2e-4*(Math.abs(cx - L.cx) + Math.abs(cy - L.cy)));
    if(!best || score > best.score) best = { score, s: lo, cx, cy };
  }
  if(!best) best = { s: 1, cx: L.cx, cy: L.cy };
  const d = (L.H/2)/(best.s*tn);
  return { s: best.s, d, X: (best.cx - L.W/2)/best.s, Y: (L.H/2 - best.cy)/best.s, tn, cx: best.cx, cy: best.cy };
}
function frame(keepRotation){
  if(!viewer) return;
  const F = fit(layout());
  const q = keepRotation ? viewer.getView().slice(4, 8) : PAGE.q0;
  // [position du modèle, z du groupe de rotation, quaternion, x et y du groupe de rotation] :
  // le centre de rotation (origine des coordonnées) est affiché au point (cx, cy) de la zone
  viewer.setView([0, 0, 0, CAMERA_Z - F.d, q[0], q[1], q[2], q[3], F.X, F.Y]);
}
// Contrôle du cadrage (?check=1) : projection de tous les atomes (et du contour de la membrane)
// pour 36 positions de la rotation auto, comptés s'ils tombent sous un encart de la slide ou une carte.
function zoneReport(){
  const L = layout(), F = fit(L), q = PAGE.q0, pts = [];
  models.forEach(m => m.selectedAtoms({}).forEach(a => pts.push([a.x, a.y, a.z])));
  if(PAGE.membrane) for(const y of PAGE.membrane.faces) for(let i = 0; i < 72; i++){
    const a = 2*Math.PI*i/72; pts.push([PAGE.membrane.r*Math.cos(a), y, PAGE.membrane.r*Math.sin(a)]); }
  const names = L.full ? [] : ['encart titre', 'légende texte'], rects = {};
  document.querySelectorAll('.bar, .legend').forEach(el => names.push(el.classList.contains('bar') ? 'carte des boutons' : 'carte ' + el.id));
  forbidden(L.full).forEach((r, i) => { rects[names[i]] = r; });
  const worst = {}; Object.keys(rects).forEach(k => { worst[k] = 0; });
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  const qv = (v) => {           // rotation d'un vecteur par le quaternion q
    const [qx, qy, qz, qw] = q, tx = 2*(qy*v[2] - qz*v[1]), ty = 2*(qz*v[0] - qx*v[2]), tz = 2*(qx*v[1] - qy*v[0]);
    return [v[0] + qw*tx + qy*tz - qz*ty, v[1] + qw*ty + qz*tx - qx*tz, v[2] + qw*tz + qx*ty - qy*tx]; };
  for(let k = 0; k < 36; k++){
    const phi = k*Math.PI/18, c = Math.cos(phi), s = Math.sin(phi), cnt = {};
    Object.keys(rects).forEach(n => { cnt[n] = 0; });
    for(const p of pts){
      const r = qv([c*p[0] + s*p[2], p[1], -s*p[0] + c*p[2]]), depth = F.d - r[2];
      const sx = L.W/2 + (F.X + r[0])/depth*(L.H/2)/F.tn, sy = L.H/2 - (F.Y + r[1])/depth*(L.H/2)/F.tn;
      x0 = Math.min(x0, sx); x1 = Math.max(x1, sx); y0 = Math.min(y0, sy); y1 = Math.max(y1, sy);
      for(const n in rects){ const R = rects[n]; if(sx > R[0] && sx < R[2] && sy > R[1] && sy < R[3]) cnt[n]++; }
    }
    for(const n in rects) worst[n] = Math.max(worst[n], cnt[n]);
  }
  // contrôle de la projection ci-dessus contre celle de 3Dmol (vue initiale, rotation auto à 0°)
  let dmax = 0;
  const probe = models[0].selectedAtoms({}).filter((a, i, all) => i % Math.max(1, Math.floor(all.length/50)) === 0);
  const cur = viewer.getView();
  frame(false);
  for(const a of probe){
    const r = qv([a.x, a.y, a.z]), depth = F.d - r[2], m = viewer.modelToScreen({x: a.x, y: a.y, z: a.z});
    dmax = Math.max(dmax, Math.hypot(L.W/2 + (F.X + r[0])/depth*(L.H/2)/F.tn - m.x, L.H/2 - (F.Y + r[1])/depth*(L.H/2)/F.tn - m.y));
  }
  viewer.setView(cur.concat([F.X, F.Y]));
  const cards = Object.entries(rects).filter(([n]) => n.startsWith('carte')).map(([n, R]) => n + ' x ' + Math.round(R[0]) + '–' + Math.round(R[2]) + ', y ' + Math.round(R[1]) + '–' + Math.round(R[3]));
  cards.unshift('centre de rotation affiché en (' + Math.round(F.cx) + ', ' + Math.round(F.cy) + ')');
  return 'échelle ' + F.s.toFixed(2) + ' px/Å ; projection vérifiée contre 3Dmol : écart max ' + dmax.toFixed(1) + ' px sur ' + probe.length + ' atomes ; ' + cards.join(' ; ')
    + ' | cadrage (36 positions de la rotation auto, ' + pts.length + ' points) : molécule entre x ' + Math.round(x0) + '–' + Math.round(x1)
    + ' et y ' + Math.round(y0) + '–' + Math.round(y1) + ' px ; au pire ' + Object.entries(worst).map(([n, v]) => v + ' sous ' + n).join(', ');
}

// ---- animation : rotation auto (et rotor pour l'ATP synthase), une seule image par tour de boucle ----
const animating = () => !!viewer && (spinOn || !!(hooks.animating && hooks.animating()));
function schedule(){ if(!raf && animating()) raf = requestAnimationFrame(tick); }
function redraw(){ viewer.rotate(0, 'y'); }   // redessine sans reconstruire les objets 3D
function tick(now){
  raf = 0;
  if(!animating()){ lastT = null; return; }
  const dt = lastT === null ? 0 : Math.min(0.1, (now - lastT)/1000);
  lastT = now;
  const t0 = performance.now();
  if(hooks.tick) hooks.tick(dt);
  if(spinOn) viewer.rotate(SPIN_DEG_S*dt, 'y');   // axe y du modèle : l'axe vertical de la molécule
  else redraw();
  if(hooks.frameTime) hooks.frameTime(performance.now() - t0);
  schedule();
}
function setSpin(on){
  spinOn = !!on;
  $('spin').setAttribute('aria-pressed', spinOn);
  if(!spinOn && !animating()) lastT = null;
  schedule();
}

// ---- membrane : deux disques translucides et leur contour, un par face de la bicouche ----
let membraneShapes = [];
function setMembrane(on){
  membraneShapes.forEach(s => viewer.removeShape(s));
  membraneShapes = [];
  const M = PAGE.membrane;
  if(on && M){
    const disc = viewer.addShape({ color: '#64748b', opacity: 0.16 });
    const rim = viewer.addShape({ color: '#64748b', opacity: 0.75 });
    for(const y of M.faces){
      disc.addCylinder({ start: {x: 0, y: y - 0.15, z: 0}, end: {x: 0, y: y + 0.15, z: 0}, radius: M.r,
                         fromCap: 1, toCap: 1, color: '#64748b' });
      const pts = [];
      for(let i = 0; i <= 120; i++){ const a = 2*Math.PI*i/120; pts.push({x: M.r*Math.cos(a), y, z: M.r*Math.sin(a)}); }
      rim.addCurve({ points: pts, radius: 0.3, smooth: 1, fromCap: 0, toCap: 0, color: '#64748b' });
    }
    membraneShapes = [disc, rim];
  }
}
function addSideLabels(){
  if(!PAGE.sides) return;
  const B = PAGE.box;
  PAGE.sides.forEach((t, i) => viewer.addLabel(t, {
    position: {x: 0, y: i === 0 ? B.ymax + 5 : B.ymin - 5, z: 0}, alignment: 'center',
    fontSize: 14, fontColor: '#64748b', showBackground: false, inFront: true }));
}

// ---- rendu logiciel (pas de carte graphique : SwiftShader, llvmpipe, Microsoft Basic Render...) ----
// 3Dmol lisse les bords en calculant l'image en 2 × 2 pixels (antialias) : quatre fois plus de
// pixels, sans coût notable sur une carte graphique, mais qui ralentit beaucoup un rendu par le
// processeur. Dans ce cas : pas de lissage et un ruban moins subdivisé (PAGE.cqSoft au lieu de
// PAGE.cq subdivisions par résidu). ?hq=1 force la qualité pleine, ?hq=0 la qualité allégée.
let RENDERER = '?';
function softwareGL(){
  try {
    const c = document.createElement('canvas'), gl = c.getContext('webgl2') || c.getContext('webgl');
    if(gl){
      const ext = gl.getExtension('WEBGL_debug_renderer_info');
      RENDERER = String(gl.getParameter(ext ? ext.UNMASKED_RENDERER_WEBGL : gl.RENDERER));
      const lose = gl.getExtension('WEBGL_lose_context');
      if(lose) lose.loseContext();
    }
  } catch(e){}
  if(Q.has('hq')) return !flag('hq', true);
  return /swiftshader|llvmpipe|softpipe|lavapipe|basic render|software/i.test(RENDERER);
}
let SOFTGL = false;

// ---- création du lecteur 3Dmol (différée tant que la zone est de taille nulle) ----
function init(){
  if(viewer || view.clientWidth < 2 || view.clientHeight < 2) return;
  SOFTGL = softwareGL();
  try {
    viewer = $3Dmol.createViewer(view, { backgroundColor: '#eaf6fd', antialias: !SOFTGL,
                                         cartoonQuality: SOFTGL ? PAGE.cqSoft : PAGE.cq });
  } catch(e){ viewer = null; console.warn(e); }
  if(!viewer || !viewer.getCanvas()){
    viewer = null;
    $('msg').hidden = false;
    $('msg').textContent = 'WebGL indisponible dans ce navigateur : la vue 3D ne peut pas s’afficher.';
    return;
  }
  for(const m of DATA.models)
    models.push(viewer.addModel(toPDB(m), 'pdb', { noComputeSecondaryStructure: true }));
  const B = PAGE.box;
  viewer.setSlab(-2*B.rmax, 2*B.rmax);                 // rien n'est coupé ; brouillard léger à l'arrière
  viewer.fogStart = PAGE.fogStart;
  if(hooks.setup) hooks.setup();
  viewer.render();
  frame(false);
  if(hooks.ready) hooks.ready();
  showChecks();
  schedule();
}

// ---- contrôles communs ----
$('spin').onclick = () => setSpin(!spinOn);
$('reset').onclick = () => frame(false);
['mousedown', 'touchstart', 'wheel'].forEach(t =>
  view.addEventListener(t, () => { if(spinOn) setSpin(false); }, { capture: true, passive: true }));
$('fs').onclick = () => {
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
};
function updateZones(){ $('zones').hidden = !flag('zones', false) || !!document.fullscreenElement || flag('fs', false); }
document.addEventListener('fullscreenchange', () => {
  $('fs').textContent = document.fullscreenElement ? '✕ Quitter' : '⛶ Agrandir';
  updateZones();
  if(viewer){ viewer.resize(); frame(true); }
});
setSpin(spinOn);
updateZones();

// Dans le deck : renvoyer les touches de navigation à reveal.js,
// et mettre en pause quand la slide est quittée.
const NAV = { ArrowRight:'right', ArrowLeft:'left', PageDown:'next', PageUp:'prev', ' ':'next' };
window.addEventListener('keydown', e => {
  const m = NAV[e.key];
  if(m && window.parent !== window && !document.fullscreenElement){
    e.preventDefault();
    window.parent.postMessage(JSON.stringify({ method: m, args: [] }), '*');
  }
});
window.addEventListener('message', e => {
  if(e.data === 'slide:stop'){ setSpin(false); if(hooks.stop) hooks.stop(); }
});

// ---- auto-contrôle (?check=1) ----
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function showChecks(){
  if(!flag('check', false)) return;
  const lines = ['3Dmol.js ' + ($3Dmol.version || '2.4.2') + ' · WebGL : ' + (viewer ? 'oui' : 'non') + ' · rendu : ' + RENDERER
    + ' → ' + (SOFTGL ? 'qualité allégée (sans lissage, ' + PAGE.cqSoft : 'qualité pleine (lissage 2 × 2, ' + PAGE.cq) + ' subdivisions par résidu)'];
  let total = 0;
  models.forEach((m, i) => {
    const atoms = m.selectedAtoms({}), per = {};
    let h = 0, s = 0;
    atoms.forEach(a => {
      per[a.chain] = (per[a.chain] || 0) + 1;
      if(a.atom === 'CA'){ if(a.ss === 'h') h++; else if(a.ss === 's') s++; }
    });
    total += atoms.length;
    lines.push((models.length > 1 ? (PAGE.modelNames[i] + ' : ') : '') + atoms.length + ' atomes, '
      + Object.keys(per).length + ' chaînes (' + Object.entries(per).map(([c, n]) => c + ' ' + n).join(', ')
      + ') ; résidus en hélice ' + h + ', en feuillet ' + s);
  });
  lines.push('total : ' + total + ' atomes lus par 3Dmol (' + DATA.expected + ' écrits par le générateur)');
  DATA.checks.forEach(l => lines.push(l));
  if(hooks.checks) hooks.checks(lines);
  if(!document.fullscreenElement && !flag('fs', false)) lines.push(zoneReport());
  console.log('CHECK ' + lines.join(' | '));
  $('check').innerHTML = lines.map(l => '<div>' + esc(l) + '</div>').join('');
  $('check').hidden = false;
}



// ============================================================
//  Anticorps IgG1 : chaînes lourdes, chaînes légères, glycanes en bâtonnets
// ============================================================
const HEAVY = '#2563eb', LIGHT = '#0ea5e9', GLYC = '#d97706';
hooks.setup = () => {
  viewer.setStyle({chain: ['H', 'K']}, {cartoon: {color: HEAVY}});
  viewer.setStyle({chain: ['L', 'M']}, {cartoon: {color: LIGHT}});
  viewer.setStyle({hetflag: true}, {stick: {color: GLYC, radius: 0.32}});
};
hooks.checks = lines => {
  const n = {};
  models[0].selectedAtoms({hetflag: true}).forEach(a => { n[a.chain + ':' + a.resi] = a.resn; });
  lines.push('sucres lus par 3Dmol : ' + Object.keys(n).length);
};


// ---- démarrage, après le code propre à la page ----
// La slide charge la page en paresseux (data-src) : l'iframe peut naître à taille nulle ou cachée.
new ResizeObserver(() => { if(!viewer) init(); else { viewer.resize(); frame(true); } }).observe(view);
document.addEventListener('visibilitychange', () => { if(!document.hidden){ if(!viewer) init(); schedule(); } });
init();

</script>
</body>
