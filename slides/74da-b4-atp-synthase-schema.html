<section>
  <span class="kicker">L'ATP synthase</span>
  <h2>Du flux de protons à l'ATP</h2>
  <div class="barline"></div>

  <svg viewBox="0 0 1200 480" style="width:100%;max-height:500px;display:block;margin-top:.2em" font-family="inherit">
    <defs>
      <marker id="atps-arr-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
      </marker>
      <marker id="atps-arr-k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
      </marker>
      <marker id="atps-arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--good)"/>
      </marker>
    </defs>

    <!-- ===== Coupe à travers la membrane ===== -->
    <rect x="0" y="370" width="640" height="110" fill="var(--accent)" opacity=".07"/>
    <text x="10" y="22" font-size="14" font-weight="700" fill="var(--muted)" letter-spacing="1">MATRICE — peu de H⁺</text>
    <text x="10" y="470" font-size="14" font-weight="700" fill="var(--muted)" letter-spacing="1">ESPACE INTERMEMBRANAIRE — beaucoup de H⁺</text>

    <!-- H+ -->
    <g font-size="16" font-weight="700" fill="var(--accent)">
      <text x="40" y="405">H⁺</text><text x="105" y="438">H⁺</text><text x="170" y="400">H⁺</text>
      <text x="235" y="432">H⁺</text><text x="320" y="410">H⁺</text><text x="500" y="402">H⁺</text>
      <text x="560" y="436">H⁺</text><text x="600" y="398">H⁺</text><text x="375" y="440">H⁺</text>
      <text x="60" y="262">H⁺</text><text x="580" y="282">H⁺</text>
    </g>

    <!-- membrane interne (bicouche) -->
    <rect x="0" y="300" width="640" height="70" fill="var(--soft)"/>
    <g fill="var(--muted)" opacity=".45">
      <circle cx="8" cy="306" r="5"/><circle cx="24" cy="306" r="5"/><circle cx="40" cy="306" r="5"/><circle cx="56" cy="306" r="5"/><circle cx="72" cy="306" r="5"/><circle cx="88" cy="306" r="5"/><circle cx="104" cy="306" r="5"/><circle cx="120" cy="306" r="5"/><circle cx="136" cy="306" r="5"/><circle cx="152" cy="306" r="5"/><circle cx="168" cy="306" r="5"/><circle cx="184" cy="306" r="5"/>
      <circle cx="472" cy="306" r="5"/><circle cx="488" cy="306" r="5"/><circle cx="504" cy="306" r="5"/><circle cx="520" cy="306" r="5"/><circle cx="536" cy="306" r="5"/><circle cx="552" cy="306" r="5"/><circle cx="568" cy="306" r="5"/><circle cx="584" cy="306" r="5"/><circle cx="600" cy="306" r="5"/><circle cx="616" cy="306" r="5"/><circle cx="632" cy="306" r="5"/>
      <circle cx="8" cy="364" r="5"/><circle cx="24" cy="364" r="5"/><circle cx="40" cy="364" r="5"/><circle cx="56" cy="364" r="5"/><circle cx="72" cy="364" r="5"/><circle cx="88" cy="364" r="5"/><circle cx="104" cy="364" r="5"/><circle cx="120" cy="364" r="5"/><circle cx="136" cy="364" r="5"/><circle cx="152" cy="364" r="5"/><circle cx="168" cy="364" r="5"/><circle cx="184" cy="364" r="5"/>
      <circle cx="472" cy="364" r="5"/><circle cx="488" cy="364" r="5"/><circle cx="504" cy="364" r="5"/><circle cx="520" cy="364" r="5"/><circle cx="536" cy="364" r="5"/><circle cx="552" cy="364" r="5"/><circle cx="568" cy="364" r="5"/><circle cx="584" cy="364" r="5"/><circle cx="600" cy="364" r="5"/><circle cx="616" cy="364" r="5"/><circle cx="632" cy="364" r="5"/>
    </g>
    <text x="10" y="340" font-size="13" fill="var(--muted)">membrane interne</text>

    <!-- tête α3β3 (immobile) -->
    <g stroke="#fff" stroke-width="2">
      <ellipse cx="215" cy="120" rx="34" ry="80" fill="var(--brand2)" opacity=".9"/>
      <ellipse cx="385" cy="120" rx="34" ry="80" fill="var(--brand2)" opacity=".9"/>
      <ellipse cx="257" cy="120" rx="34" ry="80" fill="var(--brand2)" opacity=".45"/>
      <ellipse cx="343" cy="120" rx="34" ry="80" fill="var(--brand2)" opacity=".45"/>
      <ellipse cx="300" cy="120" rx="34" ry="80" fill="var(--brand2)" opacity=".9"/>
    </g>
    <g font-size="15" font-weight="700" fill="#fff" text-anchor="middle">
      <text x="215" y="75">β</text><text x="300" y="75">β</text><text x="385" y="75">β</text>
    </g>
    <g font-size="15" font-weight="700" fill="var(--ink)" text-anchor="middle">
      <text x="257" y="186">α</text><text x="343" y="186">α</text>
    </g>

    <!-- bras périphérique (stator) -->
    <path d="M430 294 L430 58 Q430 30 402 30 L318 30" fill="none" stroke="var(--ink)" stroke-width="12" stroke-linecap="round" opacity=".55"/>

    <!-- tige centrale γ (rotor), asymétrique -->
    <rect x="290" y="110" width="20" height="192" rx="6" fill="var(--brand)"/>
    <ellipse cx="313" cy="140" rx="10" ry="18" fill="var(--brand)"/>

    <!-- anneau c8 (rotor) -->
    <rect x="200" y="300" width="200" height="70" fill="var(--brand)" opacity=".85"/>
    <ellipse cx="300" cy="370" rx="100" ry="12" fill="var(--brand)" opacity=".85"/>
    <ellipse cx="300" cy="300" rx="100" ry="12" fill="var(--brand)"/>
    <g stroke="#fff" stroke-width="1.5" opacity=".6">
      <line x1="208" y1="306" x2="208" y2="374"/><line x1="262" y1="311" x2="262" y2="381"/>
      <line x1="338" y1="311" x2="338" y2="381"/><line x1="392" y1="306" x2="392" y2="374"/>
    </g>
    <text x="300" y="347" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">8 sous-unités c</text>

    <!-- sous-unité a : deux demi-canaux -->
    <rect x="404" y="292" width="52" height="86" rx="12" fill="var(--muted)" opacity=".3" stroke="var(--muted)"/>
    <text x="428" y="342" font-size="15" font-weight="700" fill="var(--ink)" text-anchor="middle">a</text>

    <!-- trajet des protons -->
    <path d="M444 428 L444 352 L404 352" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#atps-arr-h)"/>
    <path d="M404 322 L420 322 L420 262" fill="none" stroke="var(--accent)" stroke-width="3" marker-end="url(#atps-arr-h)"/>
    <text x="452" y="424" font-size="13" fill="var(--accent)" font-weight="700">① entre</text>
    <text x="428" y="270" font-size="13" fill="var(--accent)" font-weight="700" text-anchor="start">③ ressort</text>

    <!-- rotation (anneau + tige) -->
    <path d="M262 226 Q300 250 338 226" fill="none" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#atps-arr-k)"/>
    <text x="252" y="258" font-size="14" fill="var(--ink)" text-anchor="end">tige γ</text>
    <text x="252" y="274" font-size="12" fill="var(--muted)" text-anchor="end">asymétrique</text>

    <!-- ADP + Pi entrent, ATP sort -->
    <text x="30" y="98" font-size="16" font-weight="700" fill="var(--ink)">ADP + Pᵢ</text>
    <line x1="112" y1="93" x2="176" y2="102" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#atps-arr-k)"/>
    <line x1="176" y1="150" x2="112" y2="160" stroke="var(--good)" stroke-width="2.5" marker-end="url(#atps-arr-g)"/>
    <text x="52" y="166" font-size="18" font-weight="800" fill="var(--good)">ATP</text>

    <!-- légendes à droite de la coupe -->
    <g font-size="14" fill="var(--ink)">
      <text x="452" y="96" font-weight="700">tête α₃β₃ : immobile</text>
      <text x="452" y="114" fill="var(--muted)">3 sites de synthèse (β)</text>
      <text x="452" y="190" font-weight="700">bras périphérique</text>
      <text x="452" y="208" fill="var(--muted)">relie la tête à a</text>
      <text x="452" y="226" fill="var(--muted)">la tête ne tourne pas</text>
      <text x="472" y="334" font-weight="700">② H⁺ fixé sur c,</text>
      <text x="472" y="352" fill="var(--muted)">l'anneau tourne d'un cran</text>
    </g>

    <!-- séparateur -->
    <line x1="660" y1="10" x2="660" y2="470" stroke="var(--line)" stroke-width="2"/>

    <!-- ===== Vue de dessus de la tête ===== -->
    <text x="930" y="22" font-size="16" font-weight="700" fill="var(--ink)" text-anchor="middle">Tête vue du dessus</text>
    <g stroke="#fff" stroke-width="2">
      <circle cx="983.7" cy="134" r="38" fill="var(--brand2)" opacity=".45"/>
      <circle cx="930" cy="227" r="38" fill="var(--brand2)" opacity=".45"/>
      <circle cx="876.3" cy="134" r="38" fill="var(--brand2)" opacity=".45"/>
      <circle cx="930" cy="103" r="38" fill="var(--brand2)" opacity=".9"/>
      <circle cx="983.7" cy="196" r="38" fill="var(--brand2)" opacity=".9"/>
      <circle cx="876.3" cy="196" r="38" fill="var(--brand2)" opacity=".9"/>
    </g>
    <circle cx="930" cy="165" r="16" fill="var(--brand)"/>
    <circle cx="930" cy="146" r="9" fill="var(--brand)"/>
    <g font-size="20" font-weight="800" fill="#fff" text-anchor="middle">
      <text x="930" y="98">T</text><text x="983.7" y="203">O</text><text x="876.3" y="203">L</text>
    </g>
    <g font-size="12" fill="#fff" text-anchor="middle">
      <text x="930" y="116">ATP</text>
    </g>
    <text x="930" y="171" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">γ</text>

    <g font-size="14">
      <text x="930" y="50" text-anchor="middle" font-weight="700" fill="var(--ink)">T, serré : ADP + Pᵢ → ATP</text>
      <text x="832" y="232" text-anchor="end" font-weight="700" fill="var(--ink)">L, lâche</text>
      <text x="832" y="250" text-anchor="end" fill="var(--muted)">fixe ADP + Pᵢ</text>
      <text x="1028" y="232" font-weight="700" fill="var(--ink)">O, ouvert</text>
      <text x="1028" y="250" fill="var(--muted)">libère l'ATP</text>
    </g>

    <text x="930" y="298" font-size="15" fill="var(--ink)" text-anchor="middle">γ tourne de 120° : chaque site β passe à l'état suivant</text>
    <text x="930" y="326" font-size="20" font-weight="800" fill="var(--brand)" text-anchor="middle">L → T → O → L</text>

    <!-- bilan -->
    <rect x="700" y="352" width="460" height="70" rx="14" fill="var(--soft)" stroke="var(--line)"/>
    <text x="930" y="382" font-size="22" font-weight="800" text-anchor="middle">
      <tspan fill="var(--accent)">8 H⁺</tspan><tspan fill="var(--ink)"> → 1 tour → </tspan><tspan fill="var(--good)">3 ATP</tspan>
    </text>
    <text x="930" y="408" font-size="13" fill="var(--muted)" text-anchor="middle">8 sous-unités c → 8 H⁺ par tour ; 3 sites β → 3 ATP par tour</text>
    <text x="930" y="450" font-size="13" fill="var(--muted)" text-anchor="middle">Dans le site T, ADP + Pᵢ ⇌ ATP est proche de l'équilibre (ΔG ≈ 0).</text>
    <text x="930" y="467" font-size="13" fill="var(--muted)" text-anchor="middle">L'énergie de rotation sert surtout au passage T → O, qui libère l'ATP.</text>
  </svg>

</section>
