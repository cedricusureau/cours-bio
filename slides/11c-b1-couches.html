<section>
  <style>
    .shellring{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:3,3}
    .shellslot{fill:#fff;stroke:var(--line);stroke-width:1.5;stroke-dasharray:2,2}
    .shell-e{opacity:0;transform-origin:center;transform-box:fill-box}
    .shell-e.s1{fill:var(--brand)}
    .shell-e.s2{fill:var(--brand2)}
    .fragment.visible .shell-e{animation:shellPopIn .4s ease forwards}
    @keyframes shellPopIn{from{opacity:0;transform:scale(.25)}to{opacity:1;transform:scale(1)}}
    .atom-card{text-align:center}
    .atom-label{font-weight:800;font-size:1.25em;color:var(--brand)}
    .atom-card.o-atom .atom-label{color:var(--accent)}
    .atom-svg{width:100%;max-width:150px;display:block;margin:2px auto}
    .beat{min-height:1.5em}
  </style>

  <span class="kicker">Les briques</span>
  <h2>Le remplissage des couches</h2>
  <div class="barline"></div>

  <div class="atom-wrap" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:.3em">

    <!-- H -->
    <div class="atom-card">
      <div class="atom-label">H</div>
      <div class="tiny muted">1 proton</div>
      <svg viewBox="0 0 140 190" class="atom-svg">
        <circle cx="70" cy="95" r="9" fill="var(--ink)"/>
        <text x="70" y="99" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">1</text>
        <circle class="shellring" cx="70" cy="95" r="26"/>
        <circle class="shellslot" cx="70" cy="69" r="6"/>
        <circle class="shellslot" cx="70" cy="121" r="6"/>
        <g class="fragment" data-fragment-index="0">
          <circle class="shell-e s1" cx="70" cy="69" r="6"/>
        </g>
      </svg>
      <div class="beat tiny muted fragment" data-fragment-index="1">1 vide → 1 liaison</div>
    </div>

    <!-- C -->
    <div class="atom-card">
      <div class="atom-label">C</div>
      <div class="tiny muted">6 protons</div>
      <svg viewBox="0 0 140 190" class="atom-svg">
        <circle cx="70" cy="95" r="9" fill="var(--ink)"/>
        <text x="70" y="99" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">6</text>
        <circle class="shellring" cx="70" cy="95" r="26"/>
        <circle class="shellslot" cx="70" cy="69" r="6"/>
        <circle class="shellslot" cx="70" cy="121" r="6"/>
        <circle class="shellring" cx="70" cy="95" r="52"/>
        <circle class="shellslot" cx="122" cy="95" r="6"/>
        <circle class="shellslot" cx="107" cy="132" r="6"/>
        <circle class="shellslot" cx="70" cy="147" r="6"/>
        <circle class="shellslot" cx="33" cy="132" r="6"/>
        <circle class="shellslot" cx="18" cy="95" r="6"/>
        <circle class="shellslot" cx="33" cy="58" r="6"/>
        <circle class="shellslot" cx="70" cy="43" r="6"/>
        <circle class="shellslot" cx="107" cy="58" r="6"/>
        <g class="fragment" data-fragment-index="0">
          <circle class="shell-e s1" cx="70" cy="69" r="6"/>
          <circle class="shell-e s1" cx="70" cy="121" r="6"/>
        </g>
        <g class="fragment" data-fragment-index="1">
          <circle class="shell-e s2" cx="122" cy="95" r="6"/>
          <circle class="shell-e s2" cx="107" cy="132" r="6"/>
          <circle class="shell-e s2" cx="70" cy="147" r="6"/>
          <circle class="shell-e s2" cx="33" cy="132" r="6"/>
        </g>
      </svg>
      <div class="beat tiny muted fragment" data-fragment-index="1">4 vides → 4 liaisons</div>
    </div>

    <!-- N -->
    <div class="atom-card">
      <div class="atom-label">N</div>
      <div class="tiny muted">7 protons</div>
      <svg viewBox="0 0 140 190" class="atom-svg">
        <circle cx="70" cy="95" r="9" fill="var(--ink)"/>
        <text x="70" y="99" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">7</text>
        <circle class="shellring" cx="70" cy="95" r="26"/>
        <circle class="shellslot" cx="70" cy="69" r="6"/>
        <circle class="shellslot" cx="70" cy="121" r="6"/>
        <circle class="shellring" cx="70" cy="95" r="52"/>
        <circle class="shellslot" cx="122" cy="95" r="6"/>
        <circle class="shellslot" cx="107" cy="132" r="6"/>
        <circle class="shellslot" cx="70" cy="147" r="6"/>
        <circle class="shellslot" cx="33" cy="132" r="6"/>
        <circle class="shellslot" cx="18" cy="95" r="6"/>
        <circle class="shellslot" cx="33" cy="58" r="6"/>
        <circle class="shellslot" cx="70" cy="43" r="6"/>
        <circle class="shellslot" cx="107" cy="58" r="6"/>
        <g class="fragment" data-fragment-index="0">
          <circle class="shell-e s1" cx="70" cy="69" r="6"/>
          <circle class="shell-e s1" cx="70" cy="121" r="6"/>
        </g>
        <g class="fragment" data-fragment-index="1">
          <circle class="shell-e s2" cx="122" cy="95" r="6"/>
          <circle class="shell-e s2" cx="107" cy="132" r="6"/>
          <circle class="shell-e s2" cx="70" cy="147" r="6"/>
          <circle class="shell-e s2" cx="33" cy="132" r="6"/>
          <circle class="shell-e s2" cx="18" cy="95" r="6"/>
        </g>
      </svg>
      <div class="beat tiny muted fragment" data-fragment-index="1">3 vides → 3 liaisons</div>
    </div>

    <!-- O -->
    <div class="atom-card o-atom">
      <div class="atom-label">O</div>
      <div class="tiny muted">8 protons</div>
      <svg viewBox="0 0 140 190" class="atom-svg">
        <circle cx="70" cy="95" r="9" fill="var(--ink)"/>
        <text x="70" y="99" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">8</text>
        <circle class="shellring" cx="70" cy="95" r="26"/>
        <circle class="shellslot" cx="70" cy="69" r="6"/>
        <circle class="shellslot" cx="70" cy="121" r="6"/>
        <circle class="shellring" cx="70" cy="95" r="52"/>
        <circle class="shellslot" cx="122" cy="95" r="6"/>
        <circle class="shellslot" cx="107" cy="132" r="6"/>
        <circle class="shellslot" cx="70" cy="147" r="6"/>
        <circle class="shellslot" cx="33" cy="132" r="6"/>
        <circle class="shellslot" cx="18" cy="95" r="6"/>
        <circle class="shellslot" cx="33" cy="58" r="6"/>
        <circle class="shellslot" cx="70" cy="43" r="6"/>
        <circle class="shellslot" cx="107" cy="58" r="6"/>
        <g class="fragment" data-fragment-index="0">
          <circle class="shell-e s1" cx="70" cy="69" r="6"/>
          <circle class="shell-e s1" cx="70" cy="121" r="6"/>
        </g>
        <g class="fragment" data-fragment-index="1">
          <circle class="shell-e s2" cx="122" cy="95" r="6"/>
          <circle class="shell-e s2" cx="107" cy="132" r="6"/>
          <circle class="shell-e s2" cx="70" cy="147" r="6"/>
          <circle class="shell-e s2" cx="33" cy="132" r="6"/>
          <circle class="shell-e s2" cx="18" cy="95" r="6"/>
          <circle class="shell-e s2" cx="33" cy="58" r="6"/>
        </g>
      </svg>
      <div class="beat tiny muted fragment" data-fragment-index="1">2 vides → 2 liaisons</div>
    </div>

  </div>

  <p class="center beat" style="margin-top:.5em">
    <span class="fragment fade-up" data-fragment-index="2">
      <span class="pill ghost">Une liaison covalente comble ces cases vides en mettant des électrons en commun</span>
    </span>
  </p>

</section>
