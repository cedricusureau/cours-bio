(async () => {
  const deck = document.getElementById("deck");
  try {
    const parts = await Promise.all(
      SLIDES.map(f => fetch("slides/" + f, { cache: "no-store" }).then(r => {
        if (!r.ok) throw new Error(f + " → HTTP " + r.status);
        return r.text();
      }))
    );
    deck.innerHTML = parts.join("\n");
  } catch (err) {
    deck.innerHTML =
      '<section><h2 style="color:#dc2626">Slides non chargées</h2>' +
      '<p style="font-size:.7em">' + err.message + '</p>' +
      '<p class="small">Ouvrir via un serveur local : <code>python -m http.server</code> ' +
      'dans ce dossier, puis <code>http://localhost:8000</code>. ' +
      'Ouvrir index.html en file:// bloque fetch().</p></section>';
  }
  prepareSlides();
  await Reveal.initialize({ hash:true, slideNumber:'c/t', width:1280, height:720, margin:0.04, center:false, transition:'slide', pdfMaxPagesPerSlide:1 });
  startSlideLayout();

  // reveal.js masque les slides non courantes (display:none) : les <video autoplay loop>
  // qu'elles contiennent se mettent en pause et ne reprennent pas seules en y revenant.
  function syncVideos(){
    document.querySelectorAll('.slides section').forEach(sec => {
      const on = sec.classList.contains('present');
      sec.querySelectorAll('video').forEach(v => { if(on) v.play().catch(()=>{}); else v.pause(); });
    });
  }
  Reveal.on('slidechanged', syncVideos);
  syncVideos();
})();
